# The 99MS login and sync API, served at api.99ms.dk. Deployed by .github/workflows/worker.yml.
name = "99ms-api"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [{ pattern = "api.99ms.dk", custom_domain = true }]

[vars]
# Pages allowed to use the API, and the domain passkeys belong to.
ORIGINS = "https://99ms.dk,https://www.99ms.dk,https://prod.99ms.dk"
RP_ID = "99ms.dk"

[[d1_databases]]
binding = "DB"
database_name = "99ms"
database_id = "c300d4cf-c494-4da7-ab2c-778c7cb98b8f"
migrations_dir = "migrations"
