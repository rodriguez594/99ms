# 99MS on Cloudflare: one Worker serves the app at 99ms.dk and the login and sync API under /api.
# Deployed by .github/workflows/worker.yml, which copies the app into ./public first (npm run build).
name = "99ms"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
routes = [
  { pattern = "99ms.dk", custom_domain = true },
  { pattern = "www.99ms.dk", custom_domain = true },
]

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[vars]
# Pages allowed to log in, and the domain passkeys belong to.
ORIGINS = "https://99ms.dk,https://www.99ms.dk"
RP_ID = "99ms.dk"

[[d1_databases]]
binding = "DB"
database_name = "99ms"
database_id = "c300d4cf-c494-4da7-ab2c-778c7cb98b8f"
