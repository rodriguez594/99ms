name: prices
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/scripts/prices.py", ".github/workflows/prices.yml"]
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts
      - name: Fetch prices
        run: python3 .github/scripts/prices.py "${{ github.repository }}"
      - name: Publish to the prices branch
        run: |
          mkdir out && mv prices.json out/ && cd out
          git init -q -b prices && git add prices.json
          git -c user.name="99ms prices" -c user.email="actions@users.noreply.github.com" commit -qm "Prices $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" prices
