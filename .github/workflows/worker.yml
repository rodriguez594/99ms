name: worker
# Deploys 99MS to Cloudflare from the repository root (wrangler.toml): the app at 99ms.dk and its API under /api.
# Needs two repository secrets: CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
on:
  # Cloudflare deploys the 99ms Worker from this repository itself (Workers Builds).
  # This workflow is a manual backup and needs the two secrets above.
  workflow_dispatch:
concurrency:
  group: worker
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings → Secrets and variables → Actions, then run this workflow again."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Deploy the Worker
        run: npx wrangler deploy
      - name: Check it answers
        run: |
          sleep 10
          curl -sS -m 20 https://99ms.dk/api/health || echo "99ms.dk is not answering from Cloudflare yet; a new custom domain can take a few minutes."
