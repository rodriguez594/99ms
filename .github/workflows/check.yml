name: site check
on:
  push:
    paths: [".github/workflows/check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== A"; dig +short 99ms.dk; echo "== www"; dig +short www.99ms.dk
          for i in $(seq 1 18); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -m 10 https://99ms.dk/)
            [ "$code" = "200" ] && { echo "site 200 after $((i*10))s"; break; }
            sleep 10
          done
          for u in https://99ms.dk/ https://www.99ms.dk/ https://99ms.dk/api/health https://99ms.dk/vendor/simplewebauthn-browser-14.0.0.mjs; do
            echo "== GET $u"; curl -sS -m 20 -D - -o /tmp/b "$u" | grep -i '^HTTP\|^server\|^content-type'; head -c 160 /tmp/b; echo
          done
          echo "== POST login options"; curl -sS -m 20 -X POST https://99ms.dk/api/auth/login/options -H "Origin: https://99ms.dk" -H "content-type: application/json" -d '{}' | head -c 300; echo
          echo "== version"; curl -s https://99ms.dk/ | grep -o 'APP_VERSION = "[0-9.]*"'
