name: site check
on:
  push:
    paths: [".github/workflows/check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          echo "== dns"; dig +short 99ms.dk; dig +short www.99ms.dk; dig +short NS 99ms.dk
          for u in https://99ms.dk/ https://99ms.dk/api/health https://99ms.dk/vendor/simplewebauthn-browser-14.0.0.mjs; do
            echo "== GET $u"; curl -sS -m 20 -D - -o /tmp/b "$u" | grep -i '^HTTP\|^server\|^content-type\|^cf-ray\|^x-github'; head -c 200 /tmp/b; echo
          done
          echo "== POST login options"; curl -sS -m 20 -i -X POST https://99ms.dk/api/auth/login/options -H "Origin: https://99ms.dk" -H "content-type: application/json" -d '{}' | head -c 600; echo
          echo "== POST register options"; curl -sS -m 20 -i -X POST https://99ms.dk/api/auth/register/options -H "Origin: https://99ms.dk" -H "content-type: application/json" -d '{"email":"probe-'$RANDOM'@example.com"}' | head -c 400; echo
