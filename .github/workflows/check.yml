name: site check
on:
  push:
    paths: [".github/workflows/check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          for i in $(seq 1 36); do
            h=$(curl -s -m 10 https://99ms.dk/api/health)
            if [ "$h" = '{"ok":true}' ]; then echo "api ok after $((i*10))s"; break; fi
            sleep 10
          done
          for u in https://99ms.dk/ https://www.99ms.dk/ https://99ms.dk/api/health https://99ms.dk/wrangler.toml; do
            echo "== $u $(curl -s -m 20 -o /dev/null -w '%{http_code}' $u)"
          done
          echo "== login options"; curl -sS -m 20 -X POST https://99ms.dk/api/auth/login/options -H "Origin: https://99ms.dk" -H "content-type: application/json" -d '{}' | head -c 200; echo
