name: site check
on:
  push:
    paths: [".github/workflows/check.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 30); do
            v=$(curl -s -m 10 "https://99ms.dk/?v=$i" | grep -o 'APP_VERSION = "[0-9.]*"')
            echo "$v"; [ "$v" = 'APP_VERSION = "2.5"' ] && { echo "live after $((i*10))s"; break; }
            sleep 10
          done
          curl -s -m 10 https://99ms.dk/api/health; echo
